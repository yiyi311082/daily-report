name: Daily Push

on:
  schedule:
    - cron: '0 0 * * 1-5'  # 工作日早8点（UTC+0对应北京时间08:00）
  workflow_dispatch:        # 支持手动触发

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python push.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
